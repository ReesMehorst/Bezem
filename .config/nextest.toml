# SPDX-License-Identifier: MIT
# cargo-nextest configuration (https://nexte.st/docs/configuration/).
# CI runs `cargo nextest run --profile ci` (docs/QUALITY_AND_RELEASE.md section 2.2).

[profile.default]
# Fail loudly instead of hanging on a stuck test.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure, not only the first one.
fail-fast = false
# No retries: a flaky test in the safety layer is a bug, not noise.
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

[profile.nightly]
# 10 000 proptest cases per property: allow up to 30 minutes per test.
fail-fast = false
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "120s", terminate-after = 15 }

[profile.nightly.junit]
path = "junit.xml"
