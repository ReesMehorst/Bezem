[package]
name = "bezem-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only helpers (MemFs, KnownFolders::sandbox). Never enable in a shipped crate.
test-support = []

[dependencies]
thiserror = "2"
globset = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.61, <0.63", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
# Self dev-dependency so integration tests always see the test-support feature.
bezem-core = { path = ".", features = ["test-support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[lints]
workspace = true
