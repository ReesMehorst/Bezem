# Repository labels, synced to GitHub by .github/workflows/labels.yml.
# Groups and names follow docs/QUALITY_AND_RELEASE.md section 4.7.
# `from_name` renames one of GitHub's default labels instead of creating a duplicate.
# Labels that exist on GitHub but are not listed here are kept, never deleted.

# Type
- name: "type: bug"
  color: "1d76db"
  description: "Something does not work as documented"
  from_name: "bug"
- name: "type: feature"
  color: "1d76db"
  description: "New feature or improvement"
  from_name: "enhancement"
- name: "type: cleaner"
  color: "1d76db"
  description: "New or changed cleaner definition"
- name: "type: docs"
  color: "1d76db"
  description: "Documentation only"
  from_name: "documentation"
- name: "type: ci"
  color: "1d76db"
  description: "CI, workflows and build tooling"
- name: "type: refactor"
  color: "1d76db"
  description: "Code change without behaviour change"
- name: "rfc"
  color: "1d76db"
  description: "Larger change that needs a 7-day comment window (QUALITY §4.1)"

# Severity
- name: "data-loss"
  color: "b60205"
  description: "Deleted or could delete the wrong files. Top priority, never auto-closed"
- name: "security"
  color: "b60205"
  description: "Security issue (see SECURITY.md)"
- name: "crash"
  color: "b60205"
  description: "Panic, crash or hang"
- name: "regression"
  color: "b60205"
  description: "Worked in an earlier version"

# Area
- name: "area: core"
  color: "0e8a16"
  description: "bezem-core outside safety"
- name: "area: safety"
  color: "0e8a16"
  description: "Safety layer: allowlist, reparse points, delete-time checks"
- name: "area: cli"
  color: "0e8a16"
  description: "bezem-cli"
- name: "area: gui"
  color: "0e8a16"
  description: "bezem-gui"
- name: "area: cleaners"
  color: "0e8a16"
  description: "Cleaner definitions and the bezem-cleaners crate"
- name: "area: elevation"
  color: "0e8a16"
  description: "Admin cleaners, elevated worker, services"
- name: "area: packaging"
  color: "0e8a16"
  description: "Releases, signing, winget, scoop"
- name: "area: i18n"
  color: "0e8a16"
  description: "Translations"

# Cleaner category
- name: "cleaner: system"
  color: "5319e7"
  description: "System cleaners"
- name: "cleaner: browser"
  color: "5319e7"
  description: "Browser cleaners"
- name: "cleaner: privacy"
  color: "5319e7"
  description: "Privacy cleaners"
- name: "cleaner: apps"
  color: "5319e7"
  description: "App and developer cleaners"

# Status
- name: "needs-triage"
  color: "fbca04"
  description: "Not looked at by a maintainer yet"
- name: "needs-repro"
  color: "fbca04"
  description: "Needs steps that reproduce the problem"
- name: "needs-info"
  color: "fbca04"
  description: "Waiting for more information from the reporter"
- name: "blocked"
  color: "fbca04"
  description: "Blocked by another issue or an external change"
- name: "accepted"
  color: "fbca04"
  description: "Agreed to be done"
- name: "wontfix: out-of-scope"
  color: "fbca04"
  description: "Out of scope, see PLAN.md §4"
  from_name: "wontfix"

# Platform
- name: "win10"
  color: "c5def5"
  description: "Windows 10"
- name: "win11"
  color: "c5def5"
  description: "Windows 11"
- name: "arm64"
  color: "c5def5"
  description: "Windows on ARM64"

# Contributor
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "7057ff"
  description: "Extra attention is wanted"
- name: "mentor available"
  color: "7057ff"
  description: "A maintainer will guide whoever picks this up"

# Process
- name: "no-changelog"
  color: "ededed"
  description: "Change needs no CHANGELOG entry"
- name: "release-blocker"
  color: "ededed"
  description: "Must be fixed before the next release"
- name: "fuzz"
  color: "ededed"
  description: "Found by or related to fuzzing"
- name: "perf"
  color: "ededed"
  description: "Performance"
- name: "dependencies"
  color: "ededed"
  description: "Dependency update (used by Dependabot)"
